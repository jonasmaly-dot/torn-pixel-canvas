services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: torn_pixels
      POSTGRES_USER: torn
      POSTGRES_PASSWORD: torn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torn -d torn_pixels"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
